name: Mark maintenance moved

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mark-maintenance-moved.yml'

permissions:
  contents: write

jobs:
  mark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add frozen repository notice
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          marker = '<!-- JIULIU_MAINTENANCE_MOVED -->'
          notice = '''<!-- JIULIU_MAINTENANCE_MOVED -->
> [!IMPORTANT]
> **本独立仓库已停止维护。** 后续修复、功能更新和在线更新统一迁移到 [`nljie1103/wp-assistant`](https://github.com/nljie1103/wp-assistant)。本仓库仅保留为历史源码快照；迁移前请先停用独立版插件，再启用“九流WP助手”。

---

'''
          path = Path('README.md')
          old = path.read_text(encoding='utf-8') if path.exists() else '# 九流 AI 文章摘要\n'
          if marker not in old:
              path.write_text(notice + old, encoding='utf-8')
          Path('ARCHIVED.md').write_text('本仓库已停止维护，后续版本统一发布于 https://github.com/nljie1103/wp-assistant 。\n', encoding='utf-8')
          PY
          rm -f .github/workflows/mark-maintenance-moved.yml
          rmdir .github/workflows .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: move maintenance to wp-assistant'
          git push origin HEAD:main
